# payment service — traces (OTLP push), metrics (/metrics scrape), logs (JSON stdout tail).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  labels: { app: payment }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      labels:
        app: payment
        log_format: json
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8005"
    spec:
      enableServiceLinks: false
      containers:
        - name: payment
          image: public.ecr.aws/w8x4g9h7/roboshop-v3/payment:1.0.0
          imagePullPolicy: Always
          ports:
            - { containerPort: 8005 }
          env:
            - { name: AMQP_HOST, value: "rabbitmq" }
            - { name: AMQP_USER, value: "roboshop" }
            - { name: AMQP_PASS, value: "RoboShop@1" }
            - { name: CART_URL, value: "http://cart:8003" }
            - { name: USER_URL, value: "http://user:8001" }
            - { name: PORT, value: "8005" }
            - { name: OTEL_SERVICE_NAME, value: "payment" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.obs.internal:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
            - { name: OTEL_TRACES_EXPORTER, value: "otlp" }
            - { name: OTEL_METRICS_EXPORTER, value: "none" }
            - { name: OTEL_LOGS_EXPORTER, value: "none" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=roboshop,deployment.environment=training" }
            - { name: OTEL_PYTHON_LOG_CORRELATION, value: "true" }
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
  labels: { app: payment }
spec:
  selector: { app: payment }
  ports:
    - { name: http, port: 8005, targetPort: 8005 }
