# cart service — traces (OTLP push), metrics (/metrics scrape), logs (JSON stdout tail).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels: { app: cart }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cart }
  template:
    metadata:
      labels:
        app: cart
        log_format: json
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8003"
    spec:
      enableServiceLinks: false
      containers:
        - name: cart
          image: public.ecr.aws/w8x4g9h7/roboshop-v3/cart:1.0.0
          imagePullPolicy: Always
          ports:
            - { containerPort: 8003 }
          env:
            - { name: REDIS_HOST, value: "valkey" }
            - { name: CATALOGUE_URL, value: "http://catalogue:8002" }
            - { name: PORT, value: "8003" }
            - { name: OTEL_SERVICE_NAME, value: "cart" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.obs.internal:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
            - { name: OTEL_TRACES_EXPORTER, value: "otlp" }
            - { name: OTEL_METRICS_EXPORTER, value: "none" }
            - { name: OTEL_LOGS_EXPORTER, value: "none" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=roboshop,deployment.environment=training" }
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels: { app: cart }
spec:
  selector: { app: cart }
  ports:
    - { name: http, port: 8003, targetPort: 8003 }
