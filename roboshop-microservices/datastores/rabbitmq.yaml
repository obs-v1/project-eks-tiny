# RabbitMQ 3.13 (+ management UI) — async order pipeline. Payment publishes to the `orders`
# queue, Orders consumes it, Orders then calls Notification. A named app user roboshop/RoboShop@1
# is created on first boot (the default `guest` only connects from localhost). AMQP on 5672,
# management UI on 15672. Services connect with AMQP_HOST=rabbitmq, AMQP_USER=roboshop.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-auth
  namespace: roboshop
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "roboshop"
  RABBITMQ_DEFAULT_PASS: "RoboShop@1"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp,    port: 5672,  targetPort: 5672 }
    - { name: mgmt,    port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          envFrom:
            - secretRef: { name: rabbitmq-auth }
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15   # rabbitmq-diagnostics CLI cold-start is slow; 1s default flaps readiness
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests: { storage: 2Gi }
