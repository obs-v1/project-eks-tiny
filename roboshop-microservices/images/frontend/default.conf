# RoboShop frontend gateway (logs pillar = JSON access log, tailed by the node agent -> Loki).
# nginx serves the Next.js static export and proxies /api/<svc>/ to each backend Service. The
# rewrites are IDENTICAL to the VM lab's (they must match each service's route prefix: user &
# catalogue have no prefix so their service segment is stripped; the rest keep theirs). Upstreams
# are resolved at request time via the cluster DNS so a backend that is briefly down doesn't stop
# nginx from starting.
log_format json_access escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"path":"$request_uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,'
  '"upstream":"$upstream_addr",'
  '"user_agent":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log json_access;
    root /usr/share/nginx/html;
    index index.html;

    resolver 172.20.0.10 valid=10s ipv6=off;

    location /api/user/ {
        set $up http://user.roboshop.svc.cluster.local:8001;
        rewrite ^/api/user/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/catalogue/ {
        set $up http://catalogue.roboshop.svc.cluster.local:8002;
        rewrite ^/api/catalogue/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cart/ {
        set $up http://cart.roboshop.svc.cluster.local:8003;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/shipping/ {
        set $up http://shipping.roboshop.svc.cluster.local:8004;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/payment/ {
        set $up http://payment.roboshop.svc.cluster.local:8005;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ratings/ {
        set $up http://ratings.roboshop.svc.cluster.local:8006;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/orders/ {
        set $up http://orders.roboshop.svc.cluster.local:8007;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
