server.port=${PORT:8007}
spring.data.mongodb.uri=${MONGO_URL:mongodb://mongodb:27017/orders}
spring.rabbitmq.host=${AMQP_HOST:rabbitmq}
spring.rabbitmq.username=${AMQP_USER:guest}
spring.rabbitmq.password=${AMQP_PASS:guest}
notification.url=${NOTIFICATION_URL:http://notification:8008}
shipping.url=${SHIPPING_URL:http://shipping:8004}

# --- Observability: metrics pillar (Actuator -> /actuator/prometheus, scraped by node agent) ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name:}
