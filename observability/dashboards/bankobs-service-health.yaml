# Reference dashboard: BankObs per-service health from LOGS + TRACES.
#
# Why logs+traces (not metrics): BankObs runs in its own cluster and exposes NO Prometheus
# app metrics — the obs Prometheus only carries `target_info` for the bankobs namespace. The
# available bankobs signals in the obs cluster are Loki (logs) and Jaeger (traces). This is the
# template the dashboard prompts are grounded in.
#
# Click-through (wired at the datasource level, so panels inherit it):
#   log line  --trace_id derived field-->  Jaeger trace  --tracesToLogsV2-->  Loki logs
#
# Provisioned by the kube-prometheus-stack Grafana sidecar: label grafana_dashboard=1,
# folder via the grafana_folder annotation. Apply with:
#   kubectl --context obs-v1-observability apply -f bankobs-service-health.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankobs-service-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "BankObs"
data:
  bankobs-service-health.json: |
    {
      "uid": "bankobs-svc-health",
      "title": "BankObs — Service Health (logs + traces)",
      "tags": ["bankobs", "logs", "traces"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "ds_loki", "label": "Loki", "type": "datasource", "query": "loki",
            "current": { "text": "Loki", "value": "loki" }
          },
          {
            "name": "ds_jaeger", "label": "Jaeger", "type": "datasource", "query": "jaeger",
            "current": { "text": "Jaeger", "value": "jaeger" }
          },
          {
            "name": "service", "label": "Service", "type": "query",
            "datasource": { "type": "loki", "uid": "${ds_loki}" },
            "query": { "label": "service_name", "stream": "{service_namespace=\"bankobs\"}", "type": 1 },
            "refresh": 2, "sort": 1, "includeAll": false,
            "current": { "text": "payment-gateway", "value": "payment-gateway" }
          }
        ]
      },
      "panels": [
        {
          "type": "stat", "title": "Log throughput (lines/s)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs", "color": { "mode": "thresholds" } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=\"$service\"} [$__rate_interval]))" }
          ]
        },
        {
          "type": "stat", "title": "Error log rate (lines/s)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs",
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "red", "value": 0.1 } ] } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=\"$service\"} |~ `(?i)\\\\b(error|exception|fatal|panic)\\\\b` [$__rate_interval]))" }
          ]
        },
        {
          "type": "timeseries", "title": "Log volume by level",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs", "custom": { "fillOpacity": 30, "stacking": { "mode": "normal" } } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "legendFormat": "{{detected_level}}",
              "expr": "sum by (detected_level) (rate({service_namespace=\"bankobs\", service_name=\"$service\"} [$__rate_interval]))" }
          ]
        },
        {
          "type": "timeseries", "title": "Request vs error rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs" } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" }, "legendFormat": "all",
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=\"$service\"} [$__rate_interval]))" },
            { "refId": "B", "datasource": { "type": "loki", "uid": "${ds_loki}" }, "legendFormat": "errors",
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=\"$service\"} |~ `(?i)\\\\b(error|exception|fatal|panic)\\\\b` [$__rate_interval]))" }
          ]
        },
        {
          "type": "logs", "title": "Logs for $service  (click a line → trace_id → Jaeger)",
          "gridPos": { "h": 11, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "options": { "showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "{service_namespace=\"bankobs\", service_name=\"$service\"}" }
          ]
        }
      ]
    }
