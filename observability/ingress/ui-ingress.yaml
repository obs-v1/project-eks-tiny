# Public UIs via Traefik. external-dns creates the records in the public zone;
# TLS is terminated at the Traefik NLB (ACM). ${DOMAIN} is substituted at deploy time.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-uis
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: "grafana.${DOMAIN}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: kps-grafana, port: { number: 80 } } } }
    - host: "prometheus.${DOMAIN}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: kps-prometheus, port: { number: 9090 } } } }
    - host: "alertmanager.${DOMAIN}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: kps-alertmanager, port: { number: 9093 } } } }
    - host: "jaeger.${DOMAIN}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: jaeger-query, port: { number: 16686 } } } }
    - host: "pyroscope.${DOMAIN}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: pyroscope, port: { number: 4040 } } } }
