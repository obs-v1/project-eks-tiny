# Loki — SingleBinary, EBS-persistent, native OTLP ingestion on /otlp.
fullnameOverride: loki

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  # Loki 7 ships tight defaults (4 MB/s, 4 MB gRPC msg) that the collector's log batches
  # blow past (429 / 503). Raise them for a busy 60-service fleet.
  server:
    grpc_server_max_recv_msg_size: 16777216
    grpc_server_max_send_msg_size: 16777216
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true   # OTLP trace_id lands as structured metadata / label
    volume_enabled: true
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 16MB
    per_stream_rate_limit_burst: 32MB
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi

# Lab scale — turn off the microservice components and the gateway.
backend:   { replicas: 0 }
read:      { replicas: 0 }
write:     { replicas: 0 }
gateway:   { enabled: false }
chunksCache:   { enabled: false }
resultsCache:  { enabled: false }
lokiCanary:    { enabled: false }
test:          { enabled: false }
