# OTel Collector (gateway) — the hub for three signals on the observability cluster.
# BankObs (other VPC) pushes OTLP here over the peering, via otel-collector.obs.internal.
mode: deployment
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib
  # No tag override: use the chart's appVersion so the config schema matches the binary
  # (a mismatched newer binary rejects service.telemetry.metrics.address the chart injects).
command:
  name: otelcol-contrib

replicaCount: 1

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: "1",  memory: 512Mi }

config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
  exporters:
    otlp/jaeger:
      endpoint: jaeger:4317
      tls: { insecure: true }
    prometheusremotewrite:
      endpoint: http://kps-prometheus:9090/api/v1/write
      tls: { insecure: true }
    otlphttp/loki:
      endpoint: http://loki:3100/otlp
      tls: { insecure: true }
  service:
    pipelines:
      traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/jaeger] }
      metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheusremotewrite] }
      logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }
