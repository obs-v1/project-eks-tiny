# kube-prometheus-stack — Prometheus + Alertmanager + Grafana + node-exporter + kube-state.
# Grafana ships pre-wired with all four correlation pivots (the heart of the course).
fullnameOverride: kps

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Receive the Collector's remote-write, and KEEP exemplars → the metric→trace pivot.
    enableRemoteWriteReceiver: true
    enableFeatures: ["exemplar-storage"]
    retention: 7d
    # Discover ServiceMonitors/Rules from any namespace, not just Helm-labeled ones.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  adminPassword: admin
  # Pin the NON-distroless Grafana image. The chart's default `<ver>-distroless` build uses the
  # pure-Go modernc.org/sqlite driver, which silently skips the migration that adds the `uid`
  # column to the `user` table — so on first boot Grafana runs all migrations, then crashes with
  # "failed to create admin user: no such column: uid" and never comes up (503 at the ingress).
  # The standard image (CGO mattn/go-sqlite3) applies that migration correctly. Same version,
  # just the non-distroless build; keep the tag in step with the chart's Grafana appVersion.
  image:
    repository: grafana/grafana
    tag: "13.3.0"
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  # Turn OFF the chart's auto Prometheus datasource so we can define it ourselves
  # WITH the exemplar wiring.
  sidecar:
    datasources:
      defaultDatasourceEnabled: false
  additionalDataSources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://kps-prometheus:9090
      isDefault: true
      jsonData:
        exemplarTraceIdDestinations:
          - name: trace_id
            datasourceUid: jaeger
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: jaeger
            url: "${__value.raw}"
    - name: Jaeger
      uid: jaeger
      type: jaeger
      access: proxy
      url: http://jaeger:16686/jaeger
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: true
          tags:
            - { key: "service.name", value: "service_name" }
        tracesToProfiles:
          datasourceUid: pyroscope
          profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
          tags:
            - { key: "service.name", value: "service_name" }
    - name: Pyroscope
      uid: pyroscope
      type: grafana-pyroscope-datasource
      access: proxy
      url: http://pyroscope:4040
